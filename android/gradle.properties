org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

android.nonTransitiveRClass=true

# Force namespace for older packages
android.enableR8.fullMode=false

# Disable strict namespace checking for older packages
android.experimental.enableArtProfiles=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# KGP 2.4.20 incremental caches fail to close on this project (Gradle/Windows).
kotlin.incremental=false
